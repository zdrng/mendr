[package]
name = "mendr"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
jiff = { version = "0.2.38", features = ["serde"] }
libc = "0.2.190"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.6"
toml_edit = "0.25.15"
ureq = { version = "3.4.2", features = ["json"] }

# Reproducible release builds (scripts/release.sh adds --locked and path
# remapping): one codegen unit, no symbols.
[profile.release]
codegen-units = 1
lto = true
strip = true
