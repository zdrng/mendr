# cargo-deny: advisories, licenses, yanked crates, wildcard versions and sources.
# Run: nix develop -c cargo deny --locked check

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml (unmaintained) via serde_yaml_ng, which parses pnpm-lock.yaml. No known vulnerability; replace the YAML parser when one is reported." },
]

[licenses]
confidence-threshold = 0.93
# The allowlist is a policy, not an inventory.
unused-allowed-license = "allow"
# GPL-3.0-compatible licenses only (mendr is GPL-3.0-only).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "GPL-3.0-only",
]
exceptions = [
    # Mozilla's root certificates as data; permissive, asks only for the license text.
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
