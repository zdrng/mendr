name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned by commit SHA.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Warm up dev shell
        run: nix develop -c true
      - name: Format
        run: nix develop -c cargo fmt --check
      - name: Clippy
        run: nix develop -c cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: nix develop -c cargo test --locked
      - name: cargo deny
        run: nix develop -c cargo deny --locked check
      - name: cargo audit
        run: nix develop -c cargo audit

  # src/platform/windows.rs: lints and unit tests on Windows. Nix does not
  # run there; rustup installs the toolchain flake.nix pins.
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          version=$(sed -n 's/^ *releaseRust = "\(.*\)";$/\1/p' flake.nix)
          rustup toolchain install "$version" --profile minimal --component clippy
          rustup default "$version"
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked

  # Unsafe code in mendr and its dependencies, as a report in the job summary.
  geiger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: cargo geiger
        run: |
          nix develop -c scripts/geiger.sh --output-format GitHubMarkdown >geiger.md
          { echo '```'; cat geiger.md; echo '```'; } >>"$GITHUB_STEP_SUMMARY"

  # The static Linux release asset is built twice, from two copies of the
  # source in different directories, and must be bit for bit identical (the
  # release workflow does the same for every target).
  reproducible:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Build twice and compare
        run: nix develop .#release -c scripts/release.sh reproduce x86_64-unknown-linux-musl dist

  # Runs mendr against test-projects/ (real builds and tests of intentionally
  # vulnerable projects, so untrusted build scripts). Rust, Node, pnpm, Gradle
  # and the JDK come from the flake's dev shell. The harness already clears the
  # environment and uses an empty HOME; this job additionally keeps secrets off
  # the machine.
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the GITHUB_TOKEN in .git/config.
          persist-credentials: false
      # No access token here: it would end up in /etc/nix/nix.conf.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Remove container daemon access
        # The runner user can reach /var/run/docker.sock; builds must not.
        run: |
          sudo systemctl stop docker.socket docker.service containerd.service || true
          sudo rm -f /var/run/docker.sock /run/docker.sock
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target
          key: fixtures-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock', 'test-projects/**/Cargo.lock', 'test-projects/**/package-lock.json', 'test-projects/**/pnpm-lock.yaml', 'test-projects/**/gradle.lockfile') }}
          restore-keys: fixtures-${{ runner.os }}-
      - name: Warm up dev shell
        run: nix develop -c true
      - name: Fixture tests
        run: nix develop -c cargo test --test fixtures -- --ignored
