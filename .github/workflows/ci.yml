name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned by commit SHA.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Warm up dev shell
        run: nix develop -c true
      - name: Format
        run: nix develop -c cargo fmt --check
      - name: Clippy
        run: nix develop -c cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: nix develop -c cargo test --locked
      - name: cargo deny
        run: nix develop -c cargo deny --locked check advisories bans sources
      - name: cargo audit
        run: nix develop -c cargo audit

  # Unsafe code in mendr and its dependencies, as a report in the job summary.
  geiger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: cargo geiger
        run: |
          nix develop -c scripts/geiger.sh --output-format GitHubMarkdown >geiger.md
          { echo '```'; cat geiger.md; echo '```'; } >>"$GITHUB_STEP_SUMMARY"

  # The release binary is built twice, from two copies of the source in
  # different directories, and must be bit for bit identical.
  reproducible:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build twice and compare
        run: nix develop -c scripts/check-reproducible.sh

  # Runs mendr against test-projects/ (real builds and tests of intentionally
  # vulnerable projects, so untrusted build scripts). Rust, Node, pnpm, Gradle
  # and the JDK come from the flake's dev shell. The harness already clears the
  # environment and uses an empty HOME; this job additionally keeps secrets off
  # the machine.
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the GITHUB_TOKEN in .git/config.
          persist-credentials: false
      # No access token here: it would end up in /etc/nix/nix.conf.
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Remove container daemon access
        # The runner user can reach /var/run/docker.sock; builds must not.
        run: |
          sudo systemctl stop docker.socket docker.service containerd.service || true
          sudo rm -f /var/run/docker.sock /run/docker.sock
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target
          key: fixtures-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock', 'test-projects/**/Cargo.lock', 'test-projects/**/package-lock.json', 'test-projects/**/pnpm-lock.yaml', 'test-projects/**/gradle.lockfile') }}
          restore-keys: fixtures-${{ runner.os }}-
      - name: Warm up dev shell
        run: nix develop -c true
      - name: Fixture tests
        run: nix develop -c cargo test --test fixtures -- --ignored
